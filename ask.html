<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問答｜年齡與憂鬱、焦慮、壓力的關係</title>
<link rel="stylesheet" href="style.css">
<script>(function(){var t;try{t=localStorage.getItem("theme")}catch(e){}document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")})()</script>
<style>
#ping,#askBtn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:8px 18px;cursor:pointer;font:inherit;font-size:.92rem}
#ping:disabled,#askBtn:disabled{opacity:.6;cursor:wait}
#pingOut,#askOut{margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.85rem;white-space:pre-wrap;word-break:break-all;min-height:2.6em}
#pingOut.err,#askOut.err{color:#b91c1c;border-color:#b91c1c}
</style>
</head>
<body>
<header class="nav"><div class="nav-in">
  <a class="brand" href="index.html">DASS 年齡研究</a>
  <nav aria-label="主要導覽"><a href="index.html">首頁</a><a href="results.html">研究結果</a><a href="ask.html" aria-current="page">問答</a><a href="about.html">關於研究</a></nav>
  <button id="theme" type="button" aria-label="切換夜覽模式"></button>
</div></header>
<main>
  <h1>問答</h1>
  <div class="card soon">
    <span class="badge">即將推出</span>
    <h2>問答功能準備中</h2>
    <p>未來可在這裡針對研究內容與結果提問。目前請先到「研究結果」查看圖表與數據，或到「關於研究」了解資料來源與方法。</p>
  </div>

  <div class="card">
    <button id="ping" type="button">測試連線</button>
    <pre id="pingOut" aria-live="polite">尚未測試</pre>
  </div>

  <div class="card">
    <button id="askBtn" type="button">測試 Gemini</button>
    <pre id="askOut" aria-live="polite">尚未測試</pre>
  </div>
</main>
<footer class="foot"><div class="foot-in">
  <div>組別：<span class="todo">（請填入組別）</span></div>
  <div>組員：<span class="todo">（請填入組員姓名）</span></div>
</div></footer>
<script>
(function(){var b=document.getElementById("theme"),r=document.documentElement;function l(){b.textContent=r.dataset.theme=="dark"?"☀ 日間模式":"🌙 夜覽模式"}b.onclick=function(){r.dataset.theme=r.dataset.theme=="dark"?"light":"dark";try{localStorage.setItem("theme",r.dataset.theme)}catch(e){}l()};l()})();

const WORKER_URL="https://dass-42.d84121213-657.workers.dev/";
(function(){
  var btn=document.getElementById("ping"), out=document.getElementById("pingOut");
  function show(t,err){out.textContent=t;out.className=err?"err":""}
  btn.onclick=async function(){
    if(WORKER_URL.indexOf("[")>-1){show("尚未設定後端網址：請把 ask.html 裡的 WORKER_URL 改成你的 Worker 網址。",true);return}
    btn.disabled=true;show("連線中…");
    try{
      var res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"test"})});
      var text=await res.text(), data;
      try{data=JSON.parse(text)}catch(e){}
      if(!res.ok)show("連線失敗（HTTP "+res.status+"）："+((data&&data.error)||text||res.statusText),true);
      else show("HTTP "+res.status+"\n"+(data?JSON.stringify(data,null,2):text));
    }catch(e){
      show("連線失敗："+e.message+"\n請確認 Worker 網址是否正確、網路是否正常。",true);
    }finally{btn.disabled=false}
  };
})();

(function(){
  var QUESTION="請用一句話自我介紹";
  var btn=document.getElementById("askBtn"), out=document.getElementById("askOut");
  function show(t,err){out.textContent=t;out.className=err?"err":""}
  btn.onclick=async function(){
    btn.disabled=true;show("Gemini 思考中…");
    try{
      var res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"ask",question:QUESTION})});
      var text=await res.text(), data;
      try{data=JSON.parse(text)}catch(e){}
      if(!res.ok||!data||!data.ok)show("失敗（HTTP "+res.status+"）："+((data&&data.error)||text||res.statusText),true);
      else show(data.answer);
    }catch(e){
      show("連線失敗："+e.message+"\n請確認 Worker 網址是否正確、網路是否正常。",true);
    }finally{btn.disabled=false}
  };
})();
</script>
</body>
</html>
