<script>
(function(){var b=document.getElementById("theme"),r=document.documentElement;function l(){b.textContent=r.dataset.theme=="dark"?"☀ 日間模式":"🌙 夜覽模式"}b.onclick=function(){r.dataset.theme=r.dataset.theme=="dark"?"light":"dark";try{localStorage.setItem("theme",r.dataset.theme)}catch(e){}l()};l()})();
const $=id=>document.getElementById(id);
const SUB=[{k:"dep",name:"憂鬱"},{k:"anx",name:"焦慮"},{k:"str",name:"壓力"}];
// ===== 從 Google Sheets 讀取資料 =====
const SHEET_ID="1ZljkDWWC1atcUiqV39T2SMFAn4oK9cdj9NOk09ufFyE", SHEET_NAME="年齡層統計";
const PUBLISHED_CSV=""; // 選填：貼上試算表「發布到網路」(CSV) 的連結，優先使用
const SHEET_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(SHEET_NAME)}`;
function parseCSV(t){
  const rows=[];let row=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==","){row.push(c);c=""}
    else if(ch=="\n"){row.push(c);rows.push(row);row=[];c=""}
    else if(ch!="\r")c+=ch;
  }
  if(c!==""||row.length){row.push(c);rows.push(row)}
  return rows;
}
const num=v=>{const x=parseFloat(String(v==null?"":v).replace(/[,%\s]/g,""));return isFinite(x)?x:null};
// 版面：上方為各年齡層 人數／平均／SD；之後依序為「憂鬱／焦慮／壓力等級人數」三個區塊
function parseSheet(rows){
  const isAge=a=>/^\d+\s*[–—-]\s*\d+$/.test(a);
  const keys={"憂鬱":"dep","焦慮":"anx","壓力":"str"}, ages=new Map();
  let blk=null;
  rows.forEach(r=>{
    const a=String(r[0]==null?"":r[0]).trim(), t=a.match(/^(憂鬱|焦慮|壓力)等級人數/);
    if(t){blk=keys[t[1]];return}
    if(!isAge(a))return;
    const g=a.replace(/\s/g,"").replace(/[—-]/g,"–");
    const o=ages.get(g)||{g,m:{},lv:{}};ages.set(g,o);
    if(!blk){o.n=num(r[3]);o.m={dep:[num(r[4]),num(r[5])],anx:[num(r[6]),num(r[7])],str:[num(r[8]),num(r[9])]}}
    else o.lv[blk]=[1,2,3,4,5].map(i=>num(r[i]));
  });
  const out=[...ages.values()].filter(o=>o.n>0).sort((a,b)=>parseInt(a.g)-parseInt(b.g));
  if(!out.length)throw new Error("找不到年齡層資料");
  out.forEach(o=>SUB.forEach(s=>{
    if(!o.m[s.k]||o.m[s.k].some(v=>v==null)||!o.lv[s.k]||o.lv[s.k].some(v=>v==null))
      throw new Error(o.g+" 的"+s.name+"資料不完整");
  }));
  return out;
}
// 以 script 標籤載入 gviz JSONP（不受 CORS 限制），回傳二維陣列
function loadJSONP(){return new Promise((ok,no)=>{
  const cb="__gs"+Date.now(), sc=document.createElement("script");
  const done=()=>{delete window[cb];sc.remove();clearTimeout(tm)};
  const tm=setTimeout(()=>{done();no(new Error("連線逾時"))},10000);
  window[cb]=r=>{done();
    if(r.status!="ok")return no(new Error((r.errors&&r.errors[0]&&r.errors[0].detailed_message)||"回應錯誤"));
    ok(r.table.rows.map(row=>(row.c||[]).map(c=>c&&c.v!=null?c.v:"")))};
  sc.onerror=()=>{done();no(new Error("Failed to load script"))};
  sc.onload=()=>setTimeout(()=>{if(window[cb]){done();no(new Error("回應格式錯誤，試算表可能未開放檢視"))}},0);
  sc.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}&headers=0&sheet=${encodeURIComponent(SHEET_NAME)}`;
  document.head.appendChild(sc);
})}

async function getRows(){
  const errs=[];
  if(PUBLISHED_CSV){
    try{const r=await fetch(PUBLISHED_CSV,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return parseCSV(await r.text())}
    catch(e){errs.push("發布連結："+e.message)}
  }
  try{return await loadJSONP()}catch(e){errs.push("JSONP："+e.message)}
  try{const r=await fetch(SHEET_URL+"&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return parseCSV(await r.text())}
  catch(e){errs.push("fetch："+e.message)}
  throw new Error(errs.join("；"));
}
(async()=>{
  try{
    const D=parseSheet(await getRows());
    const total=D.reduce((a,d)=>a+d.n,0), top=D.reduce((a,d)=>d.n>a.n?d:a,D[0]);
    $("v1").textContent=total.toLocaleString("zh-TW");
    $("v2").textContent=D.length;
    $("v3").textContent=top.g;
    $("s3").textContent="n＝"+top.n.toLocaleString("zh-TW")+"，占全體 "+(top.n/total*100).toFixed(1)+"%";
  }catch(e){
    ["v1","v2","v3"].forEach(i=>$(i).textContent="—");
    $("note").textContent="無法讀取 Google Sheets（"+e.message+"），請用瀏覽器直接開啟本檔案並確認網路連線。";
  }
})();

</script>
